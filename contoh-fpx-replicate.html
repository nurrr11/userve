<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Select Payment Method</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .checkout-container {
            background-color: #ffffff;
            max-width: 500px;
            width: 100%;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h2 {
            color: #333;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #555;
        }
        select, button {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
            box-sizing: border-box;
        }
        select:focus {
            border-color: #0056b3;
            outline: none;
        }
        .btn-pay {
            background-color: #0056b3;
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }
        .btn-pay:hover {
            background-color: #004085;
        }
        .notice {
            font-size: 12px;
            color: #777;
            margin-top: 15px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="checkout-container">
    <h2>Payment Options</h2>
    <form action="/procure-payment-intent" method="POST">
        <!-- Order Summary Placeholder -->
        <div class="form-group">
            <p><strong>Amount to Pay:</strong> RM 150.00</p>
        </div>

        <!-- Bank Selection Dropdown -->
        <div class="form-group">
            <label for="bank-select">Select Online Banking (FPX):</label>
            <select id="bank-select" name="bank_code" required>
                <option value="" disabled selected>-- Choose your bank --</option>
                <option value="maybank2u">Maybank2u</option>
                <option value="cimb_clicks">CIMB Clicks</option>
                <option value="public_bank">Public Bank</option>
                <option value="rhb_now">RHB Now</option>
                <option value="hong_leong">Hong Leong Bank</option>
            </select>
        </div>

        <!-- Proceed Button -->
        <button type="submit" class="btn-pay">Proceed to Bank</button>
    </form>
    
    <p class="notice">You will be redirected to a secure environment to complete your transaction.</p>
</div>

</body>
</html>
